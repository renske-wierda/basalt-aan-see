<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="B&B Basalt aan See in Stavoren – sfeervol overnachten aan de Friese kust. €85 per nacht voor twee personen.">
  <title>B&B Basalt aan See | Stavoren</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
<header class="header">
  <div class="container">
    <nav class="nav" id="nav">
      <a class="brand" href="#top">B&B <span>Basalt aan See</span></a>
      <div class="navlinks">
        <a href="#about" data-i18n="nav_about"></a>
        <a href="#room" data-i18n="nav_room"></a>
        <a href="#area" data-i18n="nav_area"></a>
        <a href="#info" data-i18n="nav_info"></a>
        <a href="#contact" data-i18n="nav_contact"></a>
      </div>
      <div class="languages" aria-label="Language">
        <button class="lang active" data-lang="nl">NL</button>
        <button class="lang" data-lang="de">DE</button>
        <button class="lang" data-lang="en">EN</button>
        <button class="lang" data-lang="fr">FR</button>
      </div>
      <button class="mobile-menu" id="menu" aria-label="Menu">☰</button>
    </nav>
  </div>
</header>

<main id="top">
<section class="hero">
  <div class="hero-bg"><img src="assets/images/hero.jpg" alt="Interieur van B&B Basalt aan See"></div>
  <div class="container">
    <div class="eyebrow" data-i18n="hero_tag"></div>
    <h1 data-i18n="hero_title"></h1>
    <p data-i18n="hero_text"></p>
    <div class="actions">
      <a class="btn primary" href="#room" data-i18n="hero_room"></a>
      <a class="btn ghost" href="#contact" data-i18n="hero_contact"></a>
    </div>
  </div>
</section>

<section class="intro" id="about">
  <div class="container intro-grid">
    <div>
      <div class="kicker" data-i18n="about_kicker"></div>
      <h2 data-i18n="about_title"></h2>
      <p class="lead" data-i18n="about_text1"></p>
      <p data-i18n="about_text2"></p>
      <p class="small-note" data-i18n="about_note"></p>
      <div class="features">
        <div class="feature"><div class="feature-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h16v2a6 6 0 0 1-6 6h-4a6 6 0 0 1-6-6v-2Z"/><path d="M6 12V7a3 3 0 0 1 6 0"/><path d="M4 20v1M20 20v1"/></svg></div><span data-i18n="f1"></span></div>
        <div class="feature"><div class="feature-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 21h14"/><path d="M7 21V4a1 1 0 0 1 1-1h8a1 1 0 0 1 1 1v17"/><path d="M14 12h.01"/></svg></div><span data-i18n="f2"></span></div>
        <div class="feature"><div class="feature-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 9a11 11 0 0 1 14 0"/><path d="M8 12a7 7 0 0 1 8 0"/><path d="M10.5 15a3 3 0 0 1 3 0"/><path d="M12 18h.01"/></svg></div><span data-i18n="f3"></span></div>
        <div class="feature"><div class="feature-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 9h11v7a4 4 0 0 1-4 4H9a4 4 0 0 1-4-4V9Z"/><path d="M16 11h1a3 3 0 0 1 0 6h-1"/><path d="M8 5c0 1 1 1 1 2M12 4c0 1 1 1 1 2"/></svg></div><span data-i18n="f4"></span></div>
      </div>
    </div>
    <div class="photo-card"><img src="assets/images/fireplace.jpg" alt="Koffie bij de haard in B&B Basalt aan See"></div>
  </div>
</section>

<section id="room">
  <div class="container">
    <div class="section-head">
      <div class="kicker" data-i18n="room_kicker"></div>
      <h2 data-i18n="room_title"></h2>
      <p class="lead" data-i18n="room_lead"></p>
    </div>

    <div class="price-strip">
      <div class="price-main">
        <strong>€85</strong>
        <span data-i18n="price_per"></span>
      </div>
      <div class="price-copy">
        <strong data-i18n="price_included"></strong>
        <span data-i18n="price_min"></span>
      </div>
    </div>

    <div class="gallery">
      <figure><img src="assets/images/bed.jpg" alt="Bed in B&B Basalt aan See"></figure>
      <figure><img src="assets/images/kitchen.jpg" alt="Kitchenette"></figure>
      <figure><img src="assets/images/bench.jpg" alt="Bankje voor B&B Basalt aan See"></figure>
      <figure><img src="assets/images/shower.jpg" alt="Douchecabine"></figure>
      <figure><img src="assets/images/bathroom.jpg" alt="Badkamer"></figure>
    </div>
    <div class="room-copy">
      <div>
        <h2 data-i18n="room_title"></h2>
        <p class="lead" data-i18n="room_text"></p>
      </div>
      <div class="checks">
        <div class="check" data-i18n="c1"></div><div class="check" data-i18n="c2"></div>
        <div class="check" data-i18n="c3"></div><div class="check" data-i18n="c4"></div>
        <div class="check" data-i18n="c5"></div><div class="check" data-i18n="c6"></div>
        <div class="check" data-i18n="c7"></div><div class="check" data-i18n="c8"></div>
      </div>
    </div>
  </div>
</section>

<section class="environment" id="area">
  <div class="container">
    <div class="section-head">
      <div class="kicker" data-i18n="area_kicker"></div>
      <h2 data-i18n="area_title"></h2>
      <p class="lead" data-i18n="area_text"></p>
    </div>
    <div class="env-grid env-grid-v32">
      <figure class="env-main"><img src="assets/images/harbour.jpg" alt="Haven van Stavoren"></figure>
      <figure><img src="assets/images/ship.jpg" alt="Schip in de winter"></figure>
      <figure><img src="assets/images/lighthouse.jpg" alt="Vuurtoren van Stavoren"></figure>
    </div>
  </div>
</section>

<section id="info">
  <div class="container practical-grid">
    <div>
      <div class="kicker" data-i18n="info_kicker"></div>
      <h2 data-i18n="info_title"></h2>
      <div class="info-table">
        <div class="info-row"><span data-i18n="rate"></span><span data-i18n="rate_v"></span></div>
        <div class="info-row"><span data-i18n="season"></span><span data-i18n="season_v"></span></div>
        <div class="info-row"><span data-i18n="checkin"></span><span data-i18n="checkin_v"></span></div>
        <div class="info-row"><span data-i18n="checkout"></span><span data-i18n="checkout_v"></span></div>
        <div class="info-row"><span data-i18n="access"></span><span data-i18n="access_v"></span></div>
        <div class="info-row"><span data-i18n="pets"></span><span data-i18n="pets_v"></span></div>
        <div class="info-row"><span data-i18n="smoke"></span><span data-i18n="smoke_v"></span></div>
        <div class="info-row"><span data-i18n="floor"></span><span data-i18n="floor_v"></span></div>
      </div>
    </div>
    <div class="photo-card"><img src="assets/images/outside.jpg" alt="B&B Basalt aan See aan de Voorstraat in Stavoren"></div>
  </div>
</section>

<section id="contact" class="contact-section">
  <div class="container">
    <div class="section-head">
      <div class="kicker" data-i18n="contact_kicker"></div>
      <h2 data-i18n="contact_title"></h2>
      <p class="lead" data-i18n="contact_text"></p>
    </div>
    <div class="contact-wrap">
      <div class="contact-card">
        <div class="contact-item">
          <small data-i18n="address"></small>
          <div>Voorstraat 13<br>8715 HW Stavoren</div>
        </div>
        <div class="contact-item">
          <small data-i18n="phone"></small>
          <a href="tel:+31623214060">+31 (0)6 232 140 60</a>
        </div>
        <div class="contact-item">
          <small data-i18n="email"></small>
          <a href="mailto:basaltaansee@hotmail.com">basaltaansee@hotmail.com</a>
        </div>
        <div class="contact-actions">
          <a class="btn primary" href="tel:+31623214060" data-i18n="call"></a>
          <a class="btn ghost" href="mailto:basaltaansee@hotmail.com" data-i18n="mail"></a>
        </div>
      </div>
      <div class="map-card">
        <iframe
          title="Google Maps - B&B Basalt aan See"
          loading="lazy"
          referrerpolicy="no-referrer-when-downgrade"
          src="https://www.google.com/maps?q=Voorstraat%2013%2C%208715%20HW%20Stavoren%2C%20Nederland&output=embed">
        </iframe>
        <div class="parking-note"><strong data-i18n="parking"></strong> · <span data-i18n="parking_text"></span></div>
      </div>
    </div>
  </div>
</section>
</main>

<footer class="footer">
  <div class="container footer-inner">
    <strong data-i18n="footer"></strong>
    <span>© <span id="year"></span> B&amp;B Basalt aan See</span>
  </div>
</footer>
<script src="assets/app.js"></script>
</body>
</html>
